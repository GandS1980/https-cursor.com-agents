# Da B.E.S. scoring rules (Yahoo league 686886) — the single source of truth for every point.
#
# Values transcribed from Yahoo > League > Settings on 2026-10-06. Fractional and negative
# points are enabled. `verified` stays false until
#     python -m bes.cli validate-scoring --yahoo data/inputs/yahoo_actual_scores.csv
# reports zero mismatches. Open questions that validation settles:
#   * yardage bonuses: cumulative (160 rush yds = 10 + 5) vs highest-tier-only
#   * DEF "Block Kick": whether blocked PATs count (currently FG + punt + PAT blocks)
#   * DEF "Return Yards": kick + punt return yards (currently), or also turnover returns
#   * DEF points allowed: all opponent points (currently) vs excluding DEF/ST scores
name: "Da B.E.S."
verified: false

per_unit:
  # Passing
  completions: 0.5
  incompletions: 0.0
  passing_yards: 0.04          # 25 yards per point
  passing_tds: 6.0
  passing_interceptions: -3.0
  sacks_suffered: 0.0
  # Rushing
  carries: 0.5                 # rushing attempts
  rushing_yards: 0.1           # 10 yards per point
  rushing_tds: 6.0
  # Receiving
  receptions: 1.0
  targets: 0.0
  receiving_yards: 0.1         # 10 yards per point
  receiving_tds: 6.0
  # Misc offense
  return_yards: 0.04           # 25 yards per point (kick + punt returns)
  return_tds: 6.0
  two_pt_conversions: 2.0
  fumbles_lost: -2.0
  offensive_fumble_return_tds: 6.0
  # Kicking (distance buckets below)
  pat_made: 1.0
  pat_missed: -1.0
  # Defense / special teams
  dst_sacks: 2.0
  dst_interceptions: 3.0
  dst_fumble_recoveries: 2.0
  dst_tds: 6.0
  dst_safeties: 2.0
  dst_blocked_kicks: 3.0
  dst_return_yards: 0.1        # 10 yards per point
  dst_return_tds: 6.0          # kickoff and punt return TDs
  dst_extra_point_returns: 2.0
  dst_4th_down_stops: 0.0      # not a league stat

fg_made_by_distance:
  "0_19": 3.0
  "20_29": 5.0
  "30_39": 7.0
  "40_49": 9.0
  "50_plus": 12.0
fg_missed_by_distance:
  "0_19": -3.0
  "20_29": -3.0
  "30_39": -3.0
  "40_49": -3.0
  "50_plus": -3.0

# "10 points at 300 yards; 5 points at 400 yards; 5 points at 500 yards"
bonuses:
  - name: passing_yards_bonus
    stats: [passing_yards]
    thresholds: [300, 400, 500]
    points: [10.0, 5.0, 5.0]
    mode: cumulative
  - name: rushing_yards_bonus
    stats: [rushing_yards]
    thresholds: [100, 150, 200]
    points: [10.0, 5.0, 5.0]
    mode: cumulative
  - name: receiving_yards_bonus
    stats: [receiving_yards]
    thresholds: [100, 150, 200]
    points: [10.0, 5.0, 5.0]
    mode: cumulative

dst_points_allowed_tiers:
  - [0, 0, 10.0]
  - [1, 6, 7.0]
  - [7, 13, 4.0]
  - [14, 20, 1.0]
  - [21, 27, 0.0]
  - [28, 34, -1.0]
  - [35, 999, -4.0]
dst_points_allowed_mode: all_points

dst_yards_allowed_tiers: []
